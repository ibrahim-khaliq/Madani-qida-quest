<title>Madani Qaida Quest — Lessons V8</title>
<style>
:root{--green:#07865e;--deep:#07543f;--gold:#ffe28a;--ink:#173b32}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#e6fbff}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#fffef2;border-bottom:3px solid #b6e8bd;box-shadow:0 4px 0 #4fbd7840}
.brand{font-weight:1000;font-size:clamp(15px,3vw,21px);color:var(--deep)}
.home,.welcome{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:12px 16px;color:white;font:inherit;font-weight:1000;box-shadow:0 4px 0 var(--deep);cursor:pointer;text-decoration:none;white-space:nowrap}.home{background:var(--green)}.welcome{background:#176fc1;box-shadow:0 4px 0 #104d87}
.home:active,.welcome:active{transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
main{height:calc(100% - 67px)}
iframe{width:100%;height:100%;border:0;background:white}
@media(max-width:600px){.topbar{padding:9px 10px}.home,.welcome{padding:9px 10px;font-size:12px}.brand{max-width:100%}main{height:calc(100% - 72px)}}
</style>
</head>

  <div class="brand">📚 Madani Qaida Quest — Lessons</div>
  <nav class="actions" aria-label="Navigation">

  </nav>
</header>
<main>
