<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b9e6ff"><title>Madani Qaida Quest — Choose Your Character</title><style>
:root{--ink:#10396f;--blue:#1684e8;--pink:#e95892;--green:#07985a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Trebuchet MS",sans-serif;color:var(--ink);background:linear-gradient(#92d8ff,#eaf8ff 48%,#ffedcf);min-height:100vh}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.22;background:radial-gradient(ellipse at 12% 70%,#fff 0 5%,transparent 20%),radial-gradient(ellipse at 85% 30%,#fff 0 4%,transparent 18%)}header{text-align:center;padding:16px 14px 10px}.back{border:0;border-radius:30px;background:#1268c8;color:white;font-weight:800;padding:11px 18px;cursor:pointer;box-shadow:0 4px 0 #084b94}h1{font-size:clamp(27px,4vw,44px);margin:8px 0;color:#073a80;text-shadow:0 2px white}.sub{display:inline-block;background:#ffffffdf;border:2px solid white;border-radius:30px;padding:8px 16px;font-weight:750}main{max-width:1200px;margin:10px auto 28px;padding:0 14px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:15px;align-items:start}.groups{display:grid;gap:14px}.group{padding:12px;border:4px solid #ffffffdc;border-radius:25px;background:#eaf7ffed;box-shadow:0 8px 22px #1e54802b}.group.girls{background:#ffedf4ed}.group h2{margin:0 0 10px;font-size:23px;display:flex;align-items:center;gap:9px}.group h2 span{font-size:28px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.card{border:3px solid white;border-radius:18px;background:linear-gradient(#d5edff,#fff);padding:6px;cursor:pointer;color:var(--ink);font:inherit;min-width:0;transition:.15s}.girls .card{background:linear-gradient(#ffdae8,#fff)}.card:hover{transform:translateY(-2px)}.card.selected{border-color:#1684e8;box-shadow:0 0 0 3px #1684e82b}.girls .card.selected{border-color:#e95892;box-shadow:0 0 0 3px #e958922b}.portrait{height:160px;border-radius:13px;display:flex;align-items:end;justify-content:center;overflow:hidden;background:linear-gradient(#a8dcff,#f7fcff)}.girls .portrait{background:linear-gradient(#ffd6e7,#fff8fb)}.portrait svg{height:100%;width:100%;max-width:150px}.name{font-weight:900;margin-top:6px;font-size:15px}.look{font-size:12px;opacity:.75}.preview{position:sticky;top:12px;border:4px solid white;border-radius:24px;background:linear-gradient(#d8f0ff,#fff);padding:13px;text-align:center;box-shadow:0 8px 22px #1e54802b}.preview .portrait{height:260px}.preview h2{font-size:26px;margin:10px 0 0}.preview p{margin:3px 0 12px;opacity:.8}.choose{width:100%;border:0;border-radius:16px;padding:14px 10px;background:linear-gradient(#12b76e,#008c50);color:#fff;font-size:17px;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #087246}.status{min-height:22px;font-size:13px;font-weight:750;margin-top:10px}.note{font-size:12px;opacity:.7;line-height:1.4;margin-top:8px}@media(max-width:820px){main{grid-template-columns:1fr}.preview{position:static;display:grid;grid-template-columns:110px 1fr;gap:10px;text-align:left;align-items:center;order:-1}.preview .portrait{height:145px;grid-row:span 3}.preview h2{margin:0}.preview p{margin:0}.preview .choose{grid-column:2}.preview .note,.preview .status{grid-column:1/-1}}@media(max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.portrait{height:170px}.preview{grid-template-columns:92px 1fr;padding:9px}.preview .portrait{height:130px}.preview h2{font-size:22px}.group{padding:9px}}
</style></head><body><header><button class="back" id="back">← Back</button><h1>✨ Choose Your Character</h1><div class="sub">Pick a character to be your Islamic hero in Madani Qaida Quest!</div></header><main><section class="groups"><section class="group"><h2><span>👦</span> Boys <small style="font-size:13px;color:#4382b6">4 characters</small></h2><div class="cards" id="boys"></div></section><section class="group girls"><h2><span>👧</span> Girls <small style="font-size:13px;color:#b94d78">4 characters</small></h2><div class="cards" id="girls"></div></section></section><aside class="preview"><div class="portrait" id="previewPortrait"></div><div><h2 id="previewName">Ibrahim</h2><p id="previewLook">Blue Turban</p><p>Assalamu Alaikum!</p></div><button class="choose" id="choose">✓ Choose Character</button><div class="note">Your choice is saved on this device. You can return later and choose another character.</div><div class="status" id="status" aria-live="polite"></div></aside></main>
<script>
const data=[
{name:'Ibrahim',group:'boys',look:'Blue Turban',skin:'#bd7849',hat:'#1269e9',cloth:'#fff',vest:'#596776',type:'turban'},
{name:'Haseeb',group:'boys',look:'White Cap',skin:'#d99a67',hat:'#f7f4e9',cloth:'#fff',vest:'#273e59',type:'cap'},
{name:'Yusuf',group:'boys',look:'Green Turban',skin:'#b87345',hat:'#087a45',cloth:'#fff',vest:'#15844c',type:'turban'},
{name:'Zayd',group:'boys',look:'Grey Turban',skin:'#8b5237',hat:'#55525a',cloth:'#34343b',vest:'#24252c',type:'turban'},
{name:'Bisma',group:'girls',look:'Pink Hijab',skin:'#d9976d',hat:'#f28cae',cloth:'#e980a1',type:'hijab'},
{name:'Safa',group:'girls',look:'Purple Hijab',skin:'#bd7b50',hat:'#9360d4',cloth:'#9c71d6',type:'hijab'},
{name:'Maryam',group:'girls',look:'White Hijab',skin:'#e1ae83',hat:'#f8f5ec',cloth:'#238c8d',type:'hijab'},
{name:'Aisha',group:'girls',look:'Black Hijab',skin:'#98603f',hat:'#242329',cloth:'#242329',type:'hijab'}];
function svg(c){let girls=c.type==='hijab';let headwear=girls?`<path d="M35 65 Q30 15 75 13 Q120 15 115 65 L110 145 L40 145 Z" fill="${c.hat}"/><path d="M43 48 Q75 25 107 48 L115 95 Q100 126 75 130 Q50 126 35 95Z" fill="${c.hat}"/>`:(c.type==='cap'?`<path d="M44 47 Q75 18 106 47 L104 57 L46 57Z" fill="${c.hat}" stroke="#ddd7c8" stroke-width="2"/>`:`<path d="M34 55 Q25 8 75 10 Q125 8 116 55 Q102 68 75 59 Q48 68 34 55Z" fill="${c.hat}"/><path d="M40 42 Q75 25 110 42" stroke="#ffffff66" stroke-width="4" fill="none"/>`);let body=girls?`<path d="M48 118 Q75 105 102 118 L118 195 L32 195Z" fill="${c.cloth}" stroke="#ffffff99" stroke-width="2"/>`:`<path d="M52 117 L98 117 L111 193 L39 193Z" fill="${c.cloth}" stroke="#ffffff99" stroke-width="2"/><path d="M50 122 L64 122 L75 141 L86 122 L100 122 L96 193 L54 193Z" fill="${c.vest}"/>`;return `<svg viewBox="0 0 150 205" role="img" aria-label="${c.name}, ${c.look}"><ellipse cx="75" cy="198" rx="42" ry="5" fill="#4a779933"/><path d="M51 178 L65 178 L65 196 L50 196Z M85 178 L99 178 L100 196 L85 196Z" fill="#e9eef4"/><path d="M43 193 Q57 188 67 196 L67 201 L42 201Z M83 196 Q95 188 108 193 L109 201 L83 201Z" fill="#fff" stroke="#d2dce7"/>${body}<rect x="67" y="90" width="16" height="28" rx="6" fill="${c.skin}"/><ellipse cx="42" cy="76" rx="9" ry="13" fill="${c.skin}"/><ellipse cx="108" cy="76" rx="9" ry="13" fill="${c.skin}"/><ellipse cx="75" cy="72" rx="34" ry="41" fill="${c.skin}"/><path d="M47 70 Q45 43 75 43 Q105 43 103 70 Q91 53 75 58 Q59 53 47 70Z" fill="#35231c"/>${headwear}<ellipse cx="63" cy="78" rx="6" ry="8" fill="white" stroke="#533522"/><ellipse cx="87" cy="78" rx="6" ry="8" fill="white" stroke="#533522"/><ellipse cx="64" cy="79" rx="3" ry="5" fill="#241b18"/><ellipse cx="88" cy="79" rx="3" ry="5" fill="#241b18"/><path d="M56 66 Q63 61 69 66 M81 66 Q87 61 94 66" stroke="#39231b" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M69 91 Q75 98 82 91" stroke="#78372a" stroke-width="3" stroke-linecap="round" fill="none"/>${girls?`<path d="M45 111 Q75 129 105 111 L116 181 L34 181Z" fill="${c.hat}" opacity=".96"/>`:''}<path d="M54 121 L46 161 M96 121 L104 161" stroke="${c.skin}" stroke-width="11" stroke-linecap="round"/><path d="M56 126 L94 126" stroke="#ffffff66" stroke-width="2"/></svg>`}
let selected=localStorage.getItem('madaniQaidaQuestCharacter')||'Ibrahim';function draw(){for(let group of ['boys','girls'])document.getElementById(group).innerHTML=data.filter(c=>c.group===group).map(c=>`<button class="card ${c.name===selected?'selected':''}" data-name="${c.name}" aria-pressed="${c.name===selected}"><div class="portrait">${svg(c)}</div><div class="name">${c.name}</div><div class="look">${c.look}</div></button>`).join('');let c=data.find(x=>x.name===selected)||data[0];document.getElementById('previewPortrait').innerHTML=svg(c);document.getElementById('previewName').textContent=c.name;document.getElementById('previewLook').textContent=c.look;document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{selected=b.dataset.name;document.getElementById('status').textContent='';draw()})}
document.getElementById('choose').onclick=()=>{let c=data.find(x=>x.name===selected)||data[0];localStorage.setItem('madaniQaidaQuestCharacter',c.name);localStorage.setItem('madaniQaidaQuestCharacterLook',c.look);document.getElementById('status').textContent='✓ '+c.name+' is saved as your character!';try{parent.postMessage({type:'madaniQaidaQuestCharacterSelected',character:{name:c.name,look:c.look}},'*')}catch(e){}};document.getElementById('back').onclick=()=>{if(document.referrer&&new URL(document.referrer).origin===location.origin)history.back();else document.getElementById('status').textContent='When uploaded, connect Back to your main menu page.'};draw();
</script></body></html>
