<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madani Qaida Quest — Lessons</title>
<style>
:root{--green:#07865e;--deep:#07543f;--gold:#ffe28a;--ink:#173b32}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#e6fbff}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#fffef2;border-bottom:3px solid #b6e8bd;box-shadow:0 4px 0 #4fbd7840}
.brand{font-weight:1000;font-size:clamp(15px,3vw,21px);color:var(--deep)}
.home{border:0;border-radius:14px;padding:12px 16px;background:var(--green);color:white;font:inherit;font-weight:1000;box-shadow:0 4px 0 var(--deep);cursor:pointer}
.home:active{transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}
main{height:calc(100% - 67px)}
iframe{width:100%;height:100%;border:0;background:white}
@media(max-width:480px){.topbar{padding:9px 10px}.home{padding:10px 12px}main{height:calc(100% - 72px)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">📚 Madani Qaida Quest — Lessons</div>
  <button class="home" onclick="window.location.href='https://ibrahim-khaliq.github.io/Madani-qida-quest/madani-qaida-quest-blue-turban-theme-v9-stories.html'">← Return to Home Menu</button>
</header>
<main>
  <iframe src="https://ibrahim-khaliq.github.io/Madani-qida-quest/madani-qaida-quest-21-lessons-v11.html" title="Madani Qaida Quest 21 lessons" allow="fullscreen"></iframe>
</main>
</body>
</html>
