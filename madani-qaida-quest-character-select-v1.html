<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1689ed"><title>Madani Qaida Quest — Choose Your Character</title>
<style>
:root{--navy:#103b78;--blue:#1689ed;--green:#0ba873;--ink:#16345c}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#81d3ff,#e9f8ff 50%,#d9efca);min-height:100vh}header{padding:12px 16px;background:#fffdf0;border-bottom:3px solid #b6e8bd;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:1000;color:#07543f}a,.btn{border:0;border-radius:14px;padding:11px 15px;background:var(--blue);color:white;font-weight:900;text-decoration:none;cursor:pointer;box-shadow:0 4px #075db2}main{max-width:1100px;margin:auto;padding:18px 14px 36px}.hero{text-align:center;background:#ffffffdb;border:3px solid white;border-radius:24px;padding:18px;margin-bottom:16px}.hero h1{margin:0;color:var(--navy);font-size:clamp(27px,4vw,40px)}.hero p{margin:8px 0 0;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:3px solid white;border-radius:22px;padding:12px;background:#ffffffed;box-shadow:0 6px 0 #123b7012;cursor:pointer;text-align:center;color:var(--ink);font:inherit}.card[aria-pressed=true]{border-color:#1689ed;box-shadow:0 0 0 3px #1689ed38,0 6px 0 #123b7012;background:#eff9ff}.art{height:210px;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 16%,#fff,transparent 40%),linear-gradient(#b9e7ff 0 65%,#c9e8a8 65%)}.art:before{content:"🕌";position:absolute;top:7px;left:0;right:0;font-size:42px;opacity:.65}.person{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:130px;height:178px}.hat{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:94px;height:42px;border-radius:60% 60% 38% 38%;background:var(--hat);border:3px solid #ffffff88;z-index:3}.hat:after{content:"";position:absolute;left:10px;right:10px;top:12px;border-top:5px solid #ffffff55;border-radius:50%}.face{position:absolute;top:27px;left:50%;transform:translateX(-50%);width:76px;height:80px;background:var(--skin);border-radius:44% 44% 48% 48%;border:2px solid #8b5b41;z-index:2;box-shadow:inset -6px -4px #0000000b}.eye{position:absolute;top:31px;width:11px;height:15px;background:white;border:2px solid #3d2d27;border-radius:50%}.eye:after{content:"";position:absolute;top:3px;left:3px;width:5px;height:7px;background:#30221d;border-radius:50%}.eye.l{left:13px}.eye.r{right:13px}.smile{position:absolute;top:58px;left:28px;width:20px;height:9px;border-bottom:3px solid #843b36;border-radius:50%}.beard{position:absolute;top:52px;left:13px;width:48px;height:25px;background:#30272b;clip-path:polygon(0 0,100% 0,82% 72%,50% 100%,18% 72%)}.body{position:absolute;top:99px;left:50%;transform:translateX(-50%);width:100px;height:70px;background:var(--outfit);border:2px solid #ffffffaa;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.arm{position:absolute;top:105px;width:20px;height:60px;border-radius:10px;background:var(--outfit)}.arm.l{left:2px;transform:rotate(8deg)}.arm.r{right:2px;transform:rotate(-8deg)}.girl .hat{height:72px;width:106px;border-radius:50% 50% 35% 35%;top:-10px}.girl .face{top:33px}.girl .body{width:116px;height:80px;top:96px;border-radius:15px 15px 0 0;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}.girl .beard{display:none}.name{font-size:18px;font-weight:1000;margin:10px 0 3px}.desc{font-size:13px;color:#58718b;font-weight:700}.select{display:block;margin:10px auto 0;background:#1689ed;color:white;padding:8px 12px;border-radius:12px;font-weight:900}.footer{margin-top:16px;background:#ffffffdf;border-radius:18px;padding:14px;text-align:center}.status{font-weight:900;color:#087c50;min-height:24px;margin-top:8px}.note{font-size:12px;color:#60758b;margin-top:8px}@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{height:180px}.person{transform:translateX(-50%) scale(.9);transform-origin:bottom center}.card{padding:8px}.name{font-size:16px}}@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="brand">🌟 Madani Qaida Quest · Choose Your Character</div><a href="madani-qaida-quest-blue-turban-theme-v13-progress-fix.html">← Home Menu</a></header>
<main><section class="hero"><h1>Choose Your Hero! 🌟</h1><p>Pick a ready-made character to begin. You can customise them later!</p></section><div class="grid" id="grid"></div><section class="footer"><button class="btn" id="confirm">✓ Choose This Character</button><div class="status" id="status" role="status" aria-live="polite"></div><div class="note">Your choice is saved on this device. This is a separate preview page; the main game and lessons have not been changed.</div></section></main>
<script>
(()=>{const presets=[
{id:"ibrahim",name:"Brother Ibrahim",desc:"Blue turban · White thobe",gender:"boy",skin:"#b9784e",hat:"#1769aa",outfit:"#fff",beard:true},
{id:"yusuf",name:"Yusuf",desc:"Green turban · Dark vest",gender:"boy",skin:"#d99b70",hat:"#16804a",outfit:"#55515a",beard:true},
{id:"zayd",name:"Zayd",desc:"White cap · Blue outfit",gender:"boy",skin:"#f0bd88",hat:"#f5f5f5",outfit:"#2463a8",beard:false},
{id:"amina",name:"Amina",desc:"Pink hijab · Rose outfit",gender:"girl",skin:"#d99b70",hat:"#e98aaa",outfit:"#b94f77",beard:false},
{id:"maryam",name:"Maryam",desc:"Green hijab · Green outfit",gender:"girl",skin:"#895333",hat:"#16804a",outfit:"#23734e",beard:false},
{id:"sara",name:"Sara",desc:"Blue hijab · Purple outfit",gender:"girl",skin:"#f0bd88",hat:"#1769aa",outfit:"#7c3aed",beard:false}
];let selected=presets[0];const grid=document.getElementById("grid");grid.innerHTML=presets.map(p=>'<button class="card" data-id="'+p.id+'" aria-pressed="'+(p.id===selected.id)+'"><div class="art"><div class="person '+(p.gender==="girl"?"girl":"")+'" style="--skin:'+p.skin+';--hat:'+p.hat+';--outfit:'+p.outfit+'"><div class="hat"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="smile"></i>'+(p.beard?'<i class="beard"></i>':'')+'</div><div class="body"></div><i class="arm l"></i><i class="arm r"></i></div></div><div class="name">'+p.name+'</div><div class="desc">'+p.desc+'</div><span class="select">Select</span></button>').join("");function refresh(){grid.querySelectorAll("[data-id]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===selected.id)))}grid.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(!b)return;selected=presets.find(p=>p.id===b.dataset.id)||presets[0];refresh();document.getElementById("status").textContent="Selected: "+selected.name});document.getElementById("confirm").onclick=()=>{const payload={name:selected.name,gender:selected.gender,skin:selected.skin,turban:selected.hat,outfit:selected.id==="ibrahim"?"blue":selected.outfit,beard:selected.beard?"yes":"no",presetId:selected.id,accessory:"book"};try{localStorage.setItem("mqq_character_creator_v1",JSON.stringify(payload));localStorage.setItem("mqq_character_creator_v2_preview",JSON.stringify(payload));document.getElementById("status").textContent="MashaAllah! "+selected.name+" is selected and saved on this device."}catch(e){document.getElementById("status").textContent="Please check browser storage settings."}};try{const saved=JSON.parse(localStorage.getItem("mqq_character_creator_v1")||"null");if(saved&&saved.presetId)selected=presets.find(p=>p.id===saved.presetId)||selected}catch(e){}refresh()})();
</script></body></html>
