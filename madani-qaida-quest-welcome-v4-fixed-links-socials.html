<style>
*{box-sizing:border-box}
body{margin:0;background:#e7f0e2;color:#17452f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.screen{width:min(100%,1280px);margin:0 auto;background:#f8f3df;box-shadow:0 8px 30px #173d2520}
.artwork-wrap{position:relative;line-height:0}
.artwork{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;border-radius:20px;text-decoration:none}
.hotspot:focus-visible{outline:5px solid #ffdf65;outline-offset:2px}
.guest{left:36.2%;top:79.2%;width:27.6%;height:7.1%}
.lock{position:absolute;top:55.7%;height:32%;display:flex;align-items:center;justify-content:center;background:#fff9e8b8;border-radius:22px;text-align:center}
.student{left:7.1%;width:27.8%} .staff{left:65%;width:28%}
.lock-inner{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:#6d4e17}
.lock-icon{width:clamp(42px,6.5vw,76px);height:clamp(42px,6.5vw,76px);display:grid;place-items:center;border-radius:50%;background:#fff9e8;border:3px solid #c99b3d;font-size:clamp(23px,3.8vw,42px);box-shadow:0 4px 10px #0002}
.lock-label{font-size:clamp(9px,1.4vw,16px);padding:5px 9px;border-radius:999px;background:#fff9e8;border:1px solid #d9c38d}
.brand-bar{display:flex;justify-content:center;align-items:center;gap:12px;padding:12px 16px;background:#fff9e9;border-top:2px solid #e7d8b7}
.brand-logo{width:54px;height:54px;object-fit:contain;background:white;border-radius:12px;border:1px solid #e6d8bc;padding:3px}
.brand-text{line-height:1.25} .brand-text strong{display:block;font-size:1.05rem} .brand-text span{font-size:.82rem;color:#52705d}
.social-footer{text-align:center;padding:14px 12px 20px;background:#fff9e9}
.social-footer strong{display:block;margin-bottom:10px}
.social-links{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}
.social-links a{padding:9px 13px;border-radius:999px;background:#e8f5e8;border:1px solid #c9dfc9;color:#185b3d;text-decoration:none;font-weight:750;font-size:.92rem}
.note{font-size:.78rem;color:#58715e;margin:10px 0 0}
@media(max-width:560px){.lock{border-radius:12px}.lock-label{font-size:8px;padding:4px 6px}.brand-logo{width:44px;height:44px}.social-links a{font-size:.82rem;padding:8px 10px}}
</style>
